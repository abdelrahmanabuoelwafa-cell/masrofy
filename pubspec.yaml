name: masroufy
description: A smart expense tracking app for students - 100% Offline
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  path_provider: ^2.1.6
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  uuid: ^4.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  flutter_slidable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - images/